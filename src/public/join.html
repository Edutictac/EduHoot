<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Join | EduHoot</title>
        <link rel = "stylesheet" href = "css/index.css">
        <link href="/css/fonts.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/edutictac-footer.css">
        <link rel="stylesheet" href="/css/edutictac-shared.css">
        <script src="/js/edutictac-chip.js"></script>
        <script src="https://commons.edutictac.es/assets/account-widget.js" defer></script>
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
        <meta name="theme-color" content="#6c2bd9">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <a class="back-link" href="/" data-i18n="back">← Volver</a>
        <edutictac-account class="site-account site-account--fixed site-account--start" data-home-only data-base="https://commons.edutictac.es"></edutictac-account>
        <div id="lang-switcher" data-lang-buttons>
        </div>
        <!-- Subfase B, Vue (join.js): modal del PIN i formulari d'entrada. -->
        <div id="join-app"></div>
        <template id="join-tpl">
        <div id="pinModal" class="pin-modal" :class="{ hidden: !modalOpen }" role="dialog" aria-modal="true">
            <div class="pin-modal__card">
                <h2>{{ t('join_pin_prompt') }}</h2>
                <p>{{ t('join_pin_blocked') }}</p>
                <form id="pinModalForm" class="pin-modal__form" @submit.prevent="submitPinModal">
                    <label for="pinModalInput">{{ t('join_pin') }}</label>
                    <div class="pin-modal__controls">
                        <input id="pinModalInput" ref="pinModalInput" type="number" inputmode="numeric" placeholder="12345" v-model="pinModalValue" :disabled="validating">
                    </div>
                    <button id="pinModalSubmit" class="pin-modal__submit" :class="{ 'is-loading': validating }" type="submit" :disabled="validating">{{ t('join_continue') }}</button>
                    <a id="pinModalCancel" class="pin-modal__cancel" href="/">{{ t('join_cancel') }}</a>
                    <p id="pinModalError" class="pin-modal__error" aria-live="assertive">{{ pinError }}</p>
                </form>
            </div>
        </div>
        <img id="join-logo" src="/icons/logo.svg" alt="EduHoot logo">
        <h1 id="title">EduHoot</h1>
        <div id="pin-display" class="pin-display" :class="{ hidden: !pinValidated }">
            <span class="pin-display__label">PIN</span>
            <span id="pin-display-value" class="pin-display__value">{{ pin }}</span>
        </div>
        <form ref="joinForm" action="/player/" @submit="submitJoin">
                <input type="hidden" id="pin" name="pin" :value="pin"/>
                <div class="form-field">
                    <label id="label">{{ t('join_icon') }}</label>
                    <input type="hidden" id="icon" name="icon" :value="icon">
                    <div id="icon-picker">
                        <button v-for="(item, idx) in icons" :key="idx" type="button" :data-icon="item" :class="{ selected: idx === iconIndex }" @click="selectIcon(idx)">{{ item }}</button>
                    </div>
                    <div id="icon-preview">{{ icon }}</div>
                </div>
                <div class="form-field" :class="{ hidden: studentAuthRequired }">
                    <label id = "label">{{ t('join_name') }}</label>
                    <input id = "name" ref="nameInput" class="name-field" type = "text" name="name" autocomplete="name" maxlength="20" :value="name" @input="onNameInput" />
                    <p class="join-name-hint">{{ t('join_name_hint') }}</p>
                </div>
                <div id="student-auth-fields" class="student-auth" :class="{ hidden: !studentAuthEnabled }">
                    <p class="student-auth__intro">{{ t('join_student_intro') }}</p>
                    <div class="form-field">
                        <label id="label" for="student-code">{{ t('join_student_code') }}</label>
                        <input id="student-code" ref="studentCodeInput" class="name-three" type="text" autocomplete="username" maxlength="3" pattern="[A-Za-z0-9]{3}" :required="studentAuthRequired" :value="studentCode" @input="onStudentCodeInput" />
                    </div>
                    <div class="form-field">
                        <label id="label" for="student-pin">{{ t('join_student_pin') }}</label>
                        <input id="student-pin" ref="studentPinInput" class="name-three" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" pattern="[0-9]{4,6}" :required="studentAuthRequired" :value="studentPin" @input="onStudentPinInput" />
                    </div>
                    <p id="student-auth-status" class="student-auth__status" aria-live="assertive">{{ studentAuthStatus }}</p>
                </div>
                <input type="hidden" id="studentJoinToken" name="studentJoinToken" :value="studentJoinToken">
                <input type="hidden" id="token" name="token" :value="token">
                <p id="join-name-error" class="join-name-error" aria-live="assertive" v-show="nameError">{{ nameError }}</p>
                <div class="form-field">
                    <button id = "joinButton" :disabled="!pinValidated">{{ t('join_button') }}</button>
                </div>
        </form>
        </template>
        <footer class="ett-footer ett-footer--bottom">
            <p class="ett-footer__id">
                <span class="ett-footer__brand">EduTicTac</span>
                <span aria-hidden="true">·</span>
                <span class="ett-footer__service">EduHoot</span>
                <span class="ett-footer__version" id="app-version" aria-live="polite"></span>
            </p>
            <div class="ett-footer__links">
                <a href="https://edutictac.es/" target="_blank" rel="noopener">edutictac.es</a>
                <a href="https://edutictac.es/privacitat.html" target="_blank" rel="noopener" data-i18n="footerPrivacy">Privacidad</a>
                <a href="https://edutictac.es/galetes.html" target="_blank" rel="noopener" data-i18n="footerCookies">Galetes</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot" target="_blank" rel="noopener" data-i18n="footerSource">Código fuente</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot/src/branch/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a>
            </div>
        </footer>
        <script src="/js/languages.js"></script>
        <script src="/js/env-badge.js"></script>
        <script src="js/i18n-player.js"></script>
        <script src="/js/libs/vue.global.prod.js"></script>
        <script src="js/join.js"></script>
        <script src="js/app-version.js"></script>
    </body>
</html>
