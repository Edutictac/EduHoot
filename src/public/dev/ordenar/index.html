<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>PoC · Ordenar | EduHoot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/order.css">
    <style>
        body{ font-family: system-ui, sans-serif; background: #2b1d4a; color: #fff; margin: 0; padding: 24px; }
        .poc{ max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .poc-nav{ display: flex; gap: 10px; align-items: center; }
        .poc-nav button{ min-width: 44px; min-height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.25); color: #fff; cursor: pointer; }
        .poc h1{ font-size: 22px; text-align: center; margin: 0; }
        .poc-result{ font-weight: 700; min-height: 1.4em; }
        .poc .button{ background: #ffee70; color: #14101f; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app" class="poc">
        <p class="poc-note">Prueba de concepto · ordenar (feature 7). Solo en desarrollo.</p>
        <div class="poc-nav">
            <button type="button" id="prev" @click="prev" :disabled="idx === 0" aria-label="Anterior">&#x2039;</button>
            <span id="progress">{{ progress }}</span>
            <button type="button" id="next" @click="next" :disabled="idx === questions.length - 1" aria-label="Siguiente">&#x203A;</button>
        </div>
        <h1 id="question">{{ question }}</h1>
        <order-board :key="key" :items="items" layout="vertical" :t="t" @submit="onSubmit"></order-board>
        <p id="result" class="poc-result">{{ result }}</p>
    </div>
    <script src="/js/libs/vue.global.prod.js"></script>
    <script src="/js/orderBoard.js"></script>
    <script src="poc.js"></script>
</body>
</html>
