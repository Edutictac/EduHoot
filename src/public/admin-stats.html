<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Admin Stats | EduHoot</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
    <link href="/css/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/edutictac-footer.css">
    <link rel="stylesheet" href="/css/edutictac-shared.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/edutictac-chip.js"></script>
    <script src="https://commons.edutictac.es/assets/account-widget.js" defer></script>
  </head>
  <body>
    <edutictac-account class="site-account site-account--top" data-base="https://commons.edutictac.es"></edutictac-account>
    <!-- Subfase B, Vue (admin-stats.js): tot el panell és una app de Vue. -->
    <div id="stats-app"></div>
    <template id="stats-tpl">
    <header class="admin-header">
      <div>
        <h1>Panel de estadísticas</h1>
        <p>Datos agregados y anónimos de todos los juegos.</p>
        <nav class="admin-nav"><a href="/admin/logs">Logs del servidor &rarr;</a></nav>
      </div>
      <div class="login-inline" id="auth-area">
        <button type="button" id="login-fallback" v-show="fallbackVisible" @click="login">Entrar con EduTicTac</button>
        <span id="login-status">{{ loginStatus }}</span>
      </div>
    </header>
    <main class="admin-content">
      <section class="cards" id="cards">
        <div class="card" v-for="item in cards" :key="item.label">
          <h3>{{ item.label }}</h3>
          <p class="value">{{ item.value || 0 }}</p>
          <div class="sub">{{ item.badge }}</div>
        </div>
      </section>
      <section class="breakdown" id="breakdown">
        <div class="panel" v-for="panel in panels" :key="panel.title">
          <h4>{{ panel.title }}</h4>
          <ul>
            <li v-for="row in panel.rows" :key="row.label"><span>{{ row.label }}</span><span class="value">{{ row.value || 0 }}</span></li>
          </ul>
        </div>
      </section>
    </main>
    <div id="stats-error" class="error">{{ error }}</div>
    </template>
    <script src="/js/libs/vue.global.prod.js"></script>
    <script src="/js/session-bridge.js"></script>
    <script src="/js/admin-stats.js"></script>
    <script src="/js/env-badge.js"></script>
  </body>
</html>
