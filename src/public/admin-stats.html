<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Admin Stats | EduHoot</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
    <link href="/css/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/edutictac-footer.css">
    <link rel="stylesheet" href="/css/edutictac-shared.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/edutictac-chip.js"></script>
    <script src="https://commons.edutictac.es/assets/account-widget.js" defer onerror="document.documentElement.classList.add('account-fallback')"></script>
  </head>
  <body>
    <edutictac-account class="site-account site-account--top" data-base="https://commons.edutictac.es"></edutictac-account>
    <header class="admin-header">
      <div>
        <h1>Panel de estadísticas</h1>
        <p>Datos agregados y anónimos de todos los juegos.</p>
      </div>
      <div class="login-inline" id="auth-area">
        <button type="button" id="login-fallback">Entrar con EduTicTac</button>
        <span id="login-status"></span>
      </div>
    </header>
    <main class="admin-content">
      <section class="cards" id="cards"></section>
      <section class="breakdown" id="breakdown"></section>
    </main>
    <div id="stats-error" class="error"></div>
    <script src="/js/admin-stats.js"></script>
    <script src="/js/env-badge.js"></script>
  </body>
</html>
