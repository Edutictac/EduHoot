<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Mis partidas | EduHoot</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/css/create.css">
        <link rel="stylesheet" href="/css/dropdowns.css">
        <link href="/css/fonts.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/edutictac-footer.css">
        <link rel="stylesheet" href="/css/edutictac-shared.css">
        <link rel="stylesheet" href="/css/listPages.css">
        <link rel="stylesheet" href="/css/partidas.css">
        <script src="/js/edutictac-chip.js"></script>
        <script src="https://commons.edutictac.es/assets/account-widget.js" defer></script>
        <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
        <link href="/css/brand-unify.css" rel="stylesheet">
    </head>
    <body class="lp-page">
        <!-- Historial de partides de l'usuari amb sessió (les acabades des de la seua compta, 90 dies). -->
        <edutictac-account class="site-account site-account--top" data-base="https://commons.edutictac.es"></edutictac-account>
        <div id="pt-app"></div>
        <template id="pt-tpl">
        <div class="page-shell pt-shell">
            <div class="top-row">
                <h1 id="ptPageTitle" class="lp-title"><img class="title-logo" src="/icons/logo.svg" alt="" width="56" height="56"><span>{{ t('title') }}</span></h1>
                <div class="top-actions">
                    <a id="ptHomeLink" :title="t('backHome')" class="btn btn-ghost btn-small" href="/">{{ t('backHome') }}</a>
                    <a id="ptBackLink" :title="t('back')" class="btn btn-ghost btn-small" href="/create/">{{ t('back') }}</a>
                    <a id="ptHomeworkLink" :title="t('myHomework')" class="btn btn-ghost btn-small" href="/create/homework/">{{ t('myHomework') }}</a>
                    <label class="lang-switch">
                        <span>{{ t('langLabel') }}</span>
                        <select id="lang-select" data-lang-options="name"></select>
                    </label>
                </div>
            </div>

            <div v-if="user" class="lp-toolbar">
                <div class="lp-view" role="group" :aria-label="t('viewLabel')">
                    <button id="ptViewCards" :title="t('viewCards')" type="button" class="btn btn-ghost btn-small" :class="{ 'is-active': listView === 'cards' }" :aria-pressed="listView === 'cards' ? 'true' : 'false'" @click="setView('cards')">{{ t('viewCards') }}</button>
                    <button id="ptViewDetail" :title="t('viewDetail')" type="button" class="btn btn-ghost btn-small" :class="{ 'is-active': listView === 'detail' }" :aria-pressed="listView === 'detail' ? 'true' : 'false'" @click="setView('detail')">{{ t('viewDetail') }}</button>
                </div>
                <label v-if="listView === 'cards'" class="lp-cover"><span>{{ t('coverLabel') }}</span>
                    <select id="ptCoverLevel" :value="coverLevel" @change="setCoverLevel">
                        <option :value="0">{{ t('coverNone') }}</option>
                        <option :value="10">{{ t('cover10') }}</option>
                        <option :value="20">{{ t('cover20') }}</option>
                        <option :value="30">{{ t('cover30') }}</option>
                    </select>
                </label>
            </div>

            <p v-if="loading" class="hw-muted">{{ t('loading') }}</p>
            <p v-else-if="!user" id="ptNeedLogin" class="hw-notice">{{ t('needLogin') }} <a href="/create/">{{ t('goLogin') }}</a></p>

            <div v-else id="lpArea" class="pt-area">
                <p v-if="error" class="hw-error" role="alert">{{ t(error) }}</p>
                <section v-if="results || resultsLoading || resultsError" id="ptResults" class="hw-card pt-results" aria-live="polite">
                <div class="pt-results__head">
                    <h2>{{ resultsGame }}</h2>
                    <button type="button" class="btn btn-ghost btn-small" @click="closeResults">{{ t('resultsClose') }}</button>
                </div>
                <p v-if="resultsLoading" class="hw-muted">{{ t('resultsLoading') }}</p>
                <p v-else-if="resultsError" class="hw-notice">{{ t('resultsError') }}</p>
                <template v-else-if="results">
                    <h3>{{ t('resPlayers') }}</h3>
                    <div class="hw-table-wrap">
                        <table class="hw-table pt-res-table" id="ptResPlayers">
                            <thead><tr><th>{{ t('colPos') }}</th><th>{{ t('colStudent') }}</th><th>{{ t('colPoints') }}</th><th>{{ t('colCorrect') }}</th><th>{{ t('colWrong') }}</th><th>{{ t('colNoAnswer') }}</th></tr></thead>
                            <tbody>
                                <tr v-for="p in results.players" :key="p.position + '-' + p.name">
                                    <td :data-label="t('colPos')">{{ p.position }}</td>
                                    <td :data-label="t('colStudent')">{{ p.name }}</td>
                                    <td :data-label="t('colPoints')">{{ p.score }}</td>
                                    <td :data-label="t('colCorrect')">{{ p.correct }}</td>
                                    <td :data-label="t('colWrong')">{{ p.wrong }}</td>
                                    <td :data-label="t('colNoAnswer')">{{ p.unanswered }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <h3>{{ t('resQuestions') }}</h3>
                    <div class="hw-table-wrap">
                        <table class="hw-table pt-res-table" id="ptResQuestions">
                            <thead><tr><th>{{ t('colQ') }}</th><th>{{ t('colQText') }}</th><th>{{ t('colCorrect') }}</th><th>{{ t('colPartial') }}</th><th>{{ t('colWrong') }}</th><th>{{ t('colNoAnswer') }}</th><th>{{ t('colOkPct') }}</th></tr></thead>
                            <tbody>
                                <tr v-for="q in results.questions" :key="q.number">
                                    <td :data-label="t('colQ')">{{ q.number }}</td>
                                    <td class="pt-res-text" :data-label="t('colQText')">{{ q.text || '—' }}</td>
                                    <td :data-label="t('colCorrect')">{{ q.correct }}</td>
                                    <td :data-label="t('colPartial')">{{ q.partial }}</td>
                                    <td :data-label="t('colWrong')">{{ q.wrong }}</td>
                                    <td :data-label="t('colNoAnswer')">{{ q.unanswered }}</td>
                                    <td :data-label="t('colOkPct')">{{ pct(q) }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </template>
            </section>
            <p v-if="!list.length" id="ptEmpty" class="hw-muted">{{ t('empty') }}</p>

                <div v-else-if="listView === 'cards'" id="ptCards" class="game-grid">
                    <article v-for="g in pageItems" :key="g.id" class="game-card pt-game">
                        <img v-if="coverLevel > 0" class="game-card__cover" :style="{ '--cover-opacity': coverLevel / 100 }" :src="coverSrc(g)" alt="" aria-hidden="true" loading="lazy" decoding="async" @error="onCoverError($event)">
                        <div class="game-card-head">
                            <div class="game-title">{{ g.quizName || '—' }}</div>
                            <span class="pt-badge" :class="'is-' + g.mode">{{ t('mode_' + g.mode) }}</span>
                        </div>
                        <div class="game-meta">PIN {{ g.pin }} · {{ t('colStudents') }}: {{ g.playersCount }}</div>
                        <div class="game-meta">{{ t('colFinished') }}: {{ dateText(g.finishedAt) }}</div>
                        <div class="game-meta">{{ t('colExpires') }}: {{ dateText(g.expiresAt) }}</div>
                        <div class="hw-actions"><button type="button" class="btn btn-ghost pt-results-btn" :title="t('results')" @click="openResults(g)"><span class="lp-txt">{{ t('results') }}</span><span class="lp-ico" aria-hidden="true">📊</span></button><a class="btn btn-primary pt-csv" :title="t('downloadCsv')" :href="'/api/partidas/' + encodeURIComponent(g.id) + '/report.csv'"><span class="lp-txt">{{ t('downloadCsv') }}</span><span class="lp-ico" aria-hidden="true">⬇</span></a><button type="button" class="btn btn-danger pt-delete-btn" :class="{ 'is-confirming': deleting === g.id }" :title="deleting === g.id ? t('deleteConfirm') : t('delete')" @click="askDelete(g)"><span class="lp-txt">{{ deleting === g.id ? t('deleteConfirm') : t('delete') }}</span><span class="lp-ico" aria-hidden="true">🗑️</span></button></div>
                    </article>
                </div>

                <div v-else class="hw-card pt-card">
                    <div class="hw-table-wrap">
                        <table class="hw-table pt-table" id="ptGames">
                            <thead><tr>
                                <th>{{ t('colQuiz') }}</th>
                                <th class="pt-col-wide">PIN</th>
                                <th>{{ t('colMode') }}</th>
                                <th>{{ t('colStudents') }}</th>
                                <th>{{ t('colFinished') }}</th>
                                <th class="pt-col-wide">{{ t('colExpires') }}</th>
                                <th></th>
                            </tr></thead>
                            <tbody>
                                <tr v-for="g in pageItems" :key="g.id">
                                    <td class="pt-name" :title="g.quizName">{{ g.quizName || '—' }}</td>
                                    <td class="pt-col-wide" data-label="PIN">{{ g.pin }}</td>
                                    <td><span class="pt-badge" :class="'is-' + g.mode">{{ t('mode_' + g.mode) }}</span></td>
                                    <td :data-label="t('colStudents')">{{ g.playersCount }}</td>
                                    <td class="pt-date" :data-label="t('colFinished')">{{ dateText(g.finishedAt) }}</td>
                                    <td class="pt-col-wide pt-date" :data-label="t('colExpires')">{{ dateText(g.expiresAt) }}</td>
                                    <td><div class="pt-actions"><button type="button" class="btn btn-ghost pt-results-btn" :title="t('results')" @click="openResults(g)"><span class="lp-txt">{{ t('results') }}</span><span class="lp-ico" aria-hidden="true">📊</span></button><a class="btn btn-primary pt-csv" :title="t('downloadCsv')" :href="'/api/partidas/' + encodeURIComponent(g.id) + '/report.csv'"><span class="lp-txt">{{ t('downloadCsv') }}</span><span class="lp-ico" aria-hidden="true">⬇</span></a><button type="button" class="btn btn-danger pt-delete-btn" :class="{ 'is-confirming': deleting === g.id }" :title="deleting === g.id ? t('deleteConfirm') : t('delete')" @click="askDelete(g)"><span class="lp-txt">{{ deleting === g.id ? t('deleteConfirm') : t('delete') }}</span><span class="lp-ico" aria-hidden="true">🗑️</span></button></div></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div v-if="user && list.length" id="lpPager" ref="pager" class="pagination pt-pager">
                <button id="ptPrev" :title="t('paginationPrev')" class="btn btn-ghost" v-show="totalPages > 1" :disabled="currentPage <= 1" @click="prevPage">{{ t('paginationPrev') }}</button>
                <select id="ptPageInfo" class="page-select" v-show="totalPages > 1" :value="currentPage" :aria-label="pageInfo" @change="onPage">
                    <option v-for="n in pageNumbers" :key="n" :value="n">{{ pageLabel(n) }}</option>
                </select>
                <button id="ptNext" :title="t('paginationNext')" class="btn btn-ghost" v-show="totalPages > 1" :disabled="currentPage >= totalPages" @click="nextPage">{{ t('paginationNext') }}</button>
                <label class="page-size"><span>{{ t('pageSizeLabel') }}</span>
                    <select id="ptPageSize" :value="pageSizeChoice" @change="onPageSize">
                        <option value="auto">{{ t('pageSizeAuto') }}</option>
                        <option v-for="n in sizes" :key="n" :value="String(n)">{{ n }}</option>
                    </select>
                </label>
            </div>
            <!-- Barra flotant (com a la biblioteca): al fons de la finestra quan el paginador de la llista no es veu. -->
            <div v-if="user && list.length" id="ptPagerFixed" class="pagination-fixed" :class="{ 'is-visible': showFixed }" :inert="!showFixed || null">
                <button id="ptFixedPrev" :title="t('paginationPrev')" class="btn btn-ghost" :disabled="currentPage <= 1" @click="prevPage">{{ t('paginationPrev') }}</button>
                <select id="ptFixedInfo" class="page-select" :value="currentPage" :aria-label="pageInfo" @change="onPage">
                    <option v-for="n in pageNumbers" :key="n" :value="n">{{ pageLabel(n) }}</option>
                </select>
                <button id="ptFixedNext" :title="t('paginationNext')" class="btn btn-ghost" :disabled="currentPage >= totalPages" @click="nextPage">{{ t('paginationNext') }}</button>
            </div>
        </div>
        </template>
        <script src="/js/libs/vue.global.prod.js"></script>
        <script src="/js/languages.js"></script>
        <script src="/js/chip-align.js"></script>
        <script src="/js/env-badge.js"></script>
        <script src="/js/listPageCommon.js"></script>
        <script src="/js/partidasHistory.js"></script>
    </body>
</html>
