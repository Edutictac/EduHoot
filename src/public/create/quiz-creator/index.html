<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Creator | EduHoot</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel = "stylesheet" href = "../../css/quizCreator.css">
        <link href="/css/fonts.css" rel="stylesheet">
    </head>
    <body>
        <a id="back" href="../" data-i18n="back">Volver</a>
        <div class="page-shell">
            <div class="top-row">
                <h1 id="title" data-i18n="title">Creador de quizzes</h1>
                <label class="lang-switch">
                    <span data-i18n="langLabel">Idioma</span>
                    <select id="lang-select" data-lang-options="name"></select>
                </label>
            </div>
            <h4 id="subtitle" data-i18n="subtitle">Diseña las preguntas y guarda tu juego para lanzarlo cuando quieras.</h4>

            <div id="creator-app"></div>
            <template id="creator-tpl">
            <div class="panel">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow" data-i18n="configEyebrow">{{ t('configEyebrow') }}</p>
                        <h3 data-i18n="configTitle">{{ t('configTitle') }}</h3>
                        <p class="subtext" data-i18n="configDesc">{{ t('configDesc') }}</p>
                    </div>
                </div>
                <div class="form-field">
                    <label id="quizTitle" for="name" data-i18n="quizTitle">{{ t('quizTitle') }}</label>
                    <input id="name" type="text" name="name" :placeholder="t('namePlaceholder')" v-model="form.name" autofocus/>
                </div>
                <div class="form-field">
                    <label for="tags" data-i18n="tagsLabel">{{ t('tagsLabel') }}</label>
                    <input id="tags" type="text" name="tags" :placeholder="t('tagsPlaceholder')" v-model="form.tags">
                </div>
                <div id="tag-suggestions" class="tag-suggestions"><template v-if="session.knownTags.length"><span class="label">{{ t('suggestedTags') }}</span><button v-for="tag in session.knownTags" :key="tag" type="button" class="tag" :class="{ active: selectedTags.indexOf(tag) !== -1 }" @click="addTag(tag)">{{ tag }}</button></template></div>
                <div class="form-field">
                    <label for="visibility" data-i18n="visibilityLabel">{{ t('visibilityLabel') }}</label>
                    <select id="visibility" name="visibility" v-model="form.visibility">
                        <option value="private">{{ t('visibilityPrivate') }}</option>
                        <option value="unlisted">{{ t('visibilityUnlisted') }}</option>
                        <option value="public">{{ t('visibilityPublic') }}</option>
                    </select>
                    <p id="public-warning" class="visibility-warning" :class="{ hidden: !showPublicWarning }">{{ t('publicWarning') }}</p>
                </div>
                <div class="form-field inline">
                    <label for="allow-clone" class="checkbox-label">
                        <input id="allow-clone" type="checkbox" v-model="form.allowClone"> {{ t('allowCloneLabel') }}
                    </label>
                </div>
                <div class="form-field">
                    <label for="language">{{ t('languageLabel') }}</label>
                    <input id="language" type="text" name="language" maxlength="40" :placeholder="t('languagePlaceholder')" v-model="form.language">
                </div>
                <div class="form-field">
                    <label for="license">{{ t('licenseLabel') }}</label>
                    <input id="license" type="text" name="license" maxlength="120" :placeholder="t('licensePlaceholder')" v-model="form.license">
                </div>
                <div class="form-field">
                    <label for="description">{{ t('descriptionLabel') }}</label>
                    <textarea id="description" name="description" maxlength="1000" :placeholder="t('descriptionPlaceholder')" v-model="form.description"></textarea>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow">{{ t('questionsEyebrow') }}</p>
                        <h3>{{ t('questionsTitle') }}</h3>
                        <p class="subtext">{{ t('questionsDesc') }}</p>
                    </div>
                    <button class="btn btn-ghost" type="button" data-i18n="addQuestion" @click="addQuestion()">{{ t('addQuestion') }}</button>
                </div>
                <div id="allQuestions" class="question-grid">
                    <div v-for="(card, index) in cards" :key="card.uid" class="question-card" :data-question="index + 1">
                        <div class="question-card-head">
                            <span class="pill pill-muted">{{ pillText(index + 1) }}</span>
                            <button class="btn btn-ghost btn-small" type="button" title="Eliminar" @click="removeCard(index)">✕</button>
                        </div>
                        <label>{{ t('questionLabel') }}</label>
                        <textarea class="question" :id="'q' + (index + 1)" rows="3" placeholder="?" v-model="card.question"></textarea>
                        <div class="question-type-row">
                            <label>{{ t('questionTypeLabel') }}</label>
                            <select class="question-type" :id="'type' + (index + 1)" v-model="card.type" @change="onTypeChange(card)">
                                <option v-for="opt in typeOptions" :key="opt[0]" :value="opt[0]">{{ t(opt[1]) }}</option>
                            </select>
                        </div>
                        <div class="answers" v-show="card.type !== 'short-answer' && card.type !== 'numeric'">
                            <label v-for="n in 4" :key="n" v-show="!(card.type === 'true-false' && n > 2)">{{ t('answerLabel') + ' ' + n }}<input :id="(index + 1) + 'a' + n" type="text" :placeholder="t('answerLabel') + ' ' + n" v-model="card.answers[n - 1]"></label>
                        </div>
                        <div class="multi-correct" :class="{ hidden: card.type !== 'multiple' }">
                            <p class="multi-correct__hint">{{ t('questionTypeMultiHint') }}</p>
                            <label v-for="n in 4" :key="n" class="multi-correct__label"><input type="checkbox" :value="String(n)" :data-answer="n" v-model="card.multi[n - 1]"> {{ t('answerLabel') + ' ' + n }}</label>
                        </div>
                        <label v-show="showCorrect(card)">{{ t('correctLabel') }}</label>
                        <input v-show="showCorrect(card)" class="correct" :id="'correct' + (index + 1)" type="number" min="1" max="4" v-model="card.correct">
                        <label>{{ t('questionTimeLabel') }}<input class="question-time" :id="'time' + (index + 1)" type="number" min="5" max="120" step="1" v-model="card.time"></label>
                        <label v-show="card.type === 'short-answer'">{{ t('shortAnswersLabel') }}<input :id="'short' + (index + 1)" type="text" placeholder="madrid|barcelona" v-model="card.short"></label>
                        <label v-show="card.type === 'numeric'">{{ t('numericAnswerLabel') }}<input :id="'num' + (index + 1)" type="text" placeholder="3,14" v-model="card.num"></label>
                        <label v-show="card.type === 'numeric'">{{ t('numericToleranceLabel') }}<input :id="'tol' + (index + 1)" type="text" placeholder="0,1" v-model="card.tol"></label>
                        <label>{{ t('imageLabel') }}</label>
                        <input :id="'img' + (index + 1)" type="text" :placeholder="t('urlPlaceholder')" v-model="card.image" @input="onImageInput(card)">
                        <div class="image-preview">
                            <img alt="Vista previa" class="image-thumb" :class="{ hidden: !card.imageOk || !imageSrc(card) }" :src="imageSrc(card)" @load="card.imageOk = true" @error="card.imageOk = false">
                        </div>
                        <label>{{ t('videoLabel') }}</label>
                        <input :id="'vid' + (index + 1)" type="text" :placeholder="t('urlPlaceholder')" v-model="card.video" @input="onVideoInput(card)">
                        <div class="video-preview">
                            <video controls class="video-thumb" :class="{ hidden: !card.videoOk || !videoSrc(card) }" :src="videoSrc(card)" @loadeddata="card.videoOk = true" @error="card.videoOk = false"></video>
                            <iframe class="video-thumb" :class="{ hidden: !youTubeEmbed(card) }" allowfullscreen loading="lazy" :src="youTubeEmbed(card)"></iframe>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel actions">
                <div class="actions-row">
                    <button class="btn btn-primary" type="button" data-i18n="btnSave" @click="save()">{{ t('btnSave') }}</button>
                    <button class="btn btn-ghost" type="button" data-i18n="btnPlayLocal" @click="playLocal()">{{ t('btnPlayLocal') }}</button>
                    <button class="btn btn-ghost" type="button" data-i18n="btnCancel" @click="cancel()">{{ t('btnCancel') }}</button>
                </div>
                <!-- localInfo es texto propio del diccionario i18n (con <br> y <strong>), no datos del usuario. -->
                <p class="subtext" v-html="t('localInfo')"></p>
            </div>
            </template>

            <p class="subtext app-version" id="app-version" aria-live="polite"></p>
        </div>

        <script src = "../../socket.io/socket.io.js"></script>
        <script src="/js/libs/vue.global.prod.js"></script>
        <script src="/js/languages.js"></script>
        <script src="/js/env-badge.js"></script>
        <script src = "../../js/quizCreator.js"></script>
        <script src="/js/app-version.js"></script>
    </body>
</html>
