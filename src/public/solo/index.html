<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Modo individual | EduHoot</title>
        <link rel="stylesheet" href="../css/solo.css">
        <link rel="stylesheet" href="../css/music-player.css">
        <link href="/css/fonts.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/edutictac-footer.css">
        <link rel="stylesheet" href="/css/edutictac-shared.css">
        <script src="/js/edutictac-chip.js"></script>
        <script src="https://commons.edutictac.es/assets/account-widget.js" defer onerror="document.documentElement.classList.add('account-fallback')"></script>
        <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <a class="back-link" href="/" data-i18n="back">← Volver</a>
        <edutictac-account class="site-account site-account--top" data-home-only data-base="https://commons.edutictac.es"></edutictac-account>
        <header class="hero">
            <img class="hero__logo" src="/icons/logo.svg" alt="EduHoot logo">
            <div class="hero__text">
                <p class="eyebrow" data-i18n="eyebrow">Modo individual</p>
                <h1 data-i18n="title">Juega a los públicos en solitario</h1>
                <p class="subtext" data-i18n="subtitle">Elige un quiz público, responde las preguntas y entra en el ranking global.</p>
            </div>
            <div class="hero__lang">
                <label class="lang-switch">
                    <span data-i18n="langLabel">Idioma</span>
                    <select id="lang-select" data-lang-options="short"></select>
                </label>
            </div>
        </header>
        <div id="solo-app"></div>
        <template id="solo-tpl">
        <main class="grid">
            <section id="catalog-panel" class="panel">
                <div class="panel__header">
                    <div>
                        <p class="eyebrow"></p>
                        <h2></h2>
                    </div>
                    <div class="panel__actions">
                        <input id="search" type="search" v-model="s.search" @input="resetPage" :placeholder="t('searchPlaceholder')">
                        <label for="sort" class="muted">{{ t('sortLabel') }}</label>
                        <select id="sort" v-model="s.sortOrder" @change="resetPage">
                            <option value="plays">{{ t('sortPlays') }}</option>
                            <option value="recent">{{ t('sortNewest') }}</option>
                            <option value="rating">{{ t('sortRating') }}</option>
                            <option value="alpha">{{ t('sortAlphaAsc') }}</option>
                            <option value="alpha-desc">{{ t('sortAlphaDesc') }}</option>
                        </select>
                    </div>
                </div>
                <div class="panel__filters">
                    <label for="tag-filter" class="muted">{{ t('filterTagLabel') }}</label>
                    <div id="tag-filter" class="tag-filter" role="group" aria-label="Etiquetas">
                        <template v-if="s.tagFilterExpanded">
                            <label v-for="item in allTags" :key="item.tag" class="tag-filter__item">
                                <input type="checkbox" :value="item.tag" v-model="s.filters.tags" @change="resetPage">
                                <span>{{ item.tag }}</span>
                            </label>
                        </template>
                    </div>
                    <div class="tag-filter__actions">
                        <button id="tags-select-all" class="tag-filter__btn is-icon" type="button" :aria-label="t('filterTagSelectAll')" @click="selectAllTags">
                            <span class="tag-filter__icon" aria-hidden="true">✓</span>
                            <span class="sr-only">{{ t('filterTagSelectAll') }}</span>
                        </button>
                        <button id="tags-toggle" v-show="allTags.length > 0" class="tag-filter__btn is-icon" type="button" :aria-label="tagToggleLabel" @click="s.tagFilterExpanded = !s.tagFilterExpanded">
                            <span class="tag-filter__icon" aria-hidden="true">{{ s.tagFilterExpanded ? '▴' : '▾' }}</span>
                            <span class="sr-only">{{ tagToggleLabel }}</span>
                        </button>
                        <button id="tags-clear" class="tag-filter__btn is-icon" type="button" :aria-label="t('filterTagClear')" @click="clearTags">
                            <span class="tag-filter__icon" aria-hidden="true">×</span>
                            <span class="sr-only">{{ t('filterTagClear') }}</span>
                        </button>
                    </div>
                    <label for="min-questions" class="muted">{{ t('filterQuestionsLabel') }}</label>
                    <input id="min-questions" type="number" min="1" inputmode="numeric" v-model="s.filters.minQuestions" @input="resetPage" :placeholder="t('filterMinPlaceholder')">
                    <span class="muted">-</span>
                    <input id="max-questions" type="number" min="1" inputmode="numeric" v-model="s.filters.maxQuestions" @input="resetPage" :placeholder="t('filterMaxPlaceholder')">
                    <label class="checkbox-inline">
                        <input id="only-image" type="checkbox" v-model="s.filters.onlyImage" @change="resetPage">
                        <span>{{ t('filterOnlyImage') }}</span>
                    </label>
                </div>
                <div id="public-list" class="cards">
                    <div v-for="q in pageItems" :key="q.id" class="card">
                        <div class="card-thumb" :class="thumb(q).loaded ? 'has-media' : 'placeholder'">
                            <img alt="" :src="thumb(q).src" @load="thumb(q).loaded = true" @error="onThumbError(q)">
                        </div>
                        <div class="card-header">
                            <h3>{{ q.name || 'Quiz' }}</h3>
                            <button type="button" class="favorite-btn" :class="{ 'is-active': isFavorite(q.id) }" :aria-pressed="isFavorite(q.id) ? 'true' : 'false'" :aria-label="favoriteLabel(q.id)" :title="favoriteLabel(q.id)" @click.stop="toggleFavorite(q.id)">{{ isFavorite(q.id) ? '❤' : '♡' }}</button>
                        </div>
                        <p class="muted">{{ format(t('byline'), { count: q.questionsCount || 0 }) }}</p>
                        <div><span v-for="(tag, i) in cleanTags(q)" :key="i" class="tag">{{ tag }}</span></div>
                        <div class="card-rating">
                            <div class="rating-stars">
                                <button v-for="stars in 5" :key="stars" type="button" class="rating-star" :class="{ 'is-filled': stars <= displayRating(q) }" :data-value="stars" :aria-label="format(t('ratingStarLabel'), { stars: stars })" :title="format(t('ratingStarLabel'), { stars: stars })" @click.stop="rate(q, stars)">★</button>
                            </div>
                            <span class="rating-summary muted">{{ ratingSummary(q) }}</span>
                        </div>
                        <div class="card-stats">{{ (q.playsCount || 0) + ' ' + t('playsShort') + ' · ' + (q.playersCount || 0) + ' ' + t('playersShort') }}</div>
                        <div class="card-links">
                            <button type="button" class="card-link" @click.stop="showRanking(q.id)">{{ t('viewRanking') }}</button>
                        </div>
                        <button class="btn btn-primary" @click="play(q.id)">{{ t('playCta') }}</button>
                    </div>
                </div>
                <p id="public-empty" class="muted">{{ emptyText }}</p>
            </section>

            <section id="game-panel" class="panel play-panel">
                <div class="panel__header">
                    <div>
                        <p class="eyebrow" data-i18n="soloEyebrow">Modo individual</p>
                        <h2 id="selected-title" data-i18n="soloTitle">Elige un juego para empezar</h2>
                    </div>
                </div>

                <div id="start-form" class="start-form hidden">
                    <p id="selected-meta" class="muted" data-i18n="startSelect">Selecciona un juego público para empezar.</p>

                    <label for="question-count" class="muted" data-i18n="questionCountLabel">Preguntas a responder</label>
                    <div class="question-count-controls">
                        <input id="question-count" type="number" min="1" step="1" inputmode="numeric" autocomplete="off">
                        <span id="question-count-total" class="muted"></span>
                    </div>
                    <label for="question-time" class="muted" data-i18n="questionTimeLabel">Tiempo por pregunta (segundos)</label>
                    <div class="question-count-controls">
                        <input id="question-time" type="number" min="5" max="120" step="1" inputmode="numeric" autocomplete="off" data-i18n-placeholder="questionTimePlaceholder" placeholder="Auto">
                    </div>

                    <button id="start-btn" class="btn btn-primary" data-i18n="startButton">Jugar en solitario</button>
                    <p class="muted" data-i18n="startHint">El tiempo por pregunta se respeta si el quiz lo define.</p>
                </div>

                <div id="game-area" class="game-area hidden">
                    <div class="game-progress">
                        <span id="question-progress" class="pill"></span>
                        <span id="score-pill" class="pill pill-muted"></span>
                        <span id="timer-pill" class="pill pill-timer"></span>
                    </div>
                    <div class="question-card">
                        <p id="question-text" class="question-text"></p>
                        <div id="question-media" class="question-media hidden">
                            <img id="question-image" alt="">
                            <video id="question-video" controls playsinline></video>
                            <iframe id="question-iframe" title="video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                        <div id="answers" class="answers"></div>
                        <div id="multi-submit-row" class="multi-submit-row">
                            <button id="multi-submit" type="button" class="btn multi-submit hidden" data-i18n="submitAnswers">Enviar respuestas</button>
                        </div>
                        <p id="feedback" class="feedback"></p>
                    </div>
                </div>

                <div id="result-area" class="result-area hidden">
                    <h3 data-i18n="finishTitle">Partida terminada</h3>
                    <p id="result-summary" class="subtext"></p>
                    <div id="ranking" class="ranking hidden">
                        <div class="ranking__header">
                            <h4 data-i18n="rankingTitle">Top 10 global</h4>
                        </div>
                        <ol id="ranking-list"></ol>
                    </div>
                    <div class="result-actions">
                        <button id="play-again" class="btn btn-primary" data-i18n="playAgain">Volver a jugar</button>
                        <button id="pick-another" class="btn btn-ghost" data-i18n="pickAnother">Elegir otro quiz</button>
                    </div>
                </div>
            </section>
        </main>
        <div id="public-pagination" class="pagination" :class="{ hidden: totalPages <= 1 }">
            <template v-if="totalPages > 1">
                <button :disabled="currentPage === 0" @click="s.page = currentPage - 1">&lt;</button>
                <span>{{ (currentPage + 1) + ' / ' + totalPages }}</span>
                <button :disabled="currentPage >= totalPages - 1" @click="s.page = currentPage + 1">&gt;</button>
            </template>
        </div>
        </template>

        <div class="music-section bottom-music">
            <div id="solo-music-player" class="music-player-shell"></div>
        </div>

        <div id="feedback-modal" class="solo-modal">
            <div class="solo-modal__content">
                <h3 id="feedback-title"></h3>
                <p id="feedback-body"></p>
                <button id="feedback-close" class="btn btn-primary">OK</button>
            </div>
        </div>

        <div id="ranking-modal" class="solo-modal">
            <div class="solo-modal__content ranking-modal__content">
                <h3 id="ranking-modal-title" data-i18n="rankingTitle">Top 10 global</h3>
                <ol id="ranking-modal-list" class="ranking-list"></ol>
                <button id="ranking-modal-close" class="btn btn-ghost" data-i18n="rankingClose">Cerrar</button>
            </div>
        </div>

        <div id="name-modal" class="solo-modal">
            <div class="solo-modal__content">
                <h3 data-i18n="nameTitle">Identifícate para el ranking</h3>
                <p class="muted" data-i18n="nameDesc">Usa 3 letras o números.</p>
                <input id="player-name" type="text" maxlength="3" pattern="[A-Za-z0-9]{1,3}" placeholder="AAA" data-i18n-placeholder="namePlaceholder" autocomplete="off">
                <div class="modal-actions">
                    <button id="name-cancel" class="btn btn-ghost" data-i18n="nameSkip">Omitir</button>
                    <button id="name-save" class="btn btn-primary" data-i18n="nameSave">Guardar</button>
                </div>
            </div>
        </div>
        <footer class="ett-footer">
            <p class="ett-footer__id">
                <span class="ett-footer__brand">EduTicTac</span>
                <span aria-hidden="true">·</span>
                <span class="ett-footer__service">EduHoot</span>
                <span class="ett-footer__version" id="app-version" aria-live="polite"></span>
            </p>
            <div class="ett-footer__links">
                <a href="https://edutictac.es/" target="_blank" rel="noopener">edutictac.es</a>
                <a href="https://edutictac.es/privacitat.html" target="_blank" rel="noopener" data-i18n="footerPrivacy">Privacidad</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot" target="_blank" rel="noopener" data-i18n="footerSource">Código fuente</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot/src/branch/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a>
            </div>
        </footer>

        <script src="../js/music-player.js"></script>
        <script src="/js/libs/vue.global.prod.js"></script>
        <script src="/js/languages.js"></script>
        <script src="/js/env-badge.js"></script>
        <script src="../js/i18n-solo.js"></script>
        <script src="../js/solo-storage.js"></script>
        <script src="../js/solo-questions.js"></script>
        <script src="../js/solo-library.js"></script>
        <script src="../js/solo-music.js"></script>
        <script src="../js/solo-game.js"></script>
        <script src="../js/solo-ranking.js"></script>
        <script src="../js/solo.js"></script>
        <script src="/js/app-version.js"></script>
    </body>
</html>
