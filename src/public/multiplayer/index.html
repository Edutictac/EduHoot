<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Multiplayer | EduHoot</title>
    <link rel="stylesheet" href="../css/multiplayer.css">
    <link rel="stylesheet" href="../css/music-player.css">
    <link href="/css/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/edutictac-footer.css">
    <link rel="stylesheet" href="/css/edutictac-shared.css">
    <script src="/js/edutictac-chip.js"></script>
    <script src="https://commons.edutictac.es/assets/account-widget.js" defer onerror="document.documentElement.classList.add('account-fallback')"></script>
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <a class="back-link" href="/" data-i18n="back">← Volver</a>
    <edutictac-account class="site-account site-account--top" data-home-only data-base="https://commons.edutictac.es"></edutictac-account>

    <header class="hero">
      <img class="hero__logo" src="/icons/logo.svg" alt="EduHoot logo">
      <div class="hero__text">
        <p class="eyebrow" data-i18n="eyebrow">Multiplayer</p>
        <h1 data-i18n="title">Juega en la misma pantalla</h1>
        <p class="subtext" data-i18n="subtitle">Elige un quiz público, selecciona 2–4 jugadores y responde en pantalla dividida.</p>
      </div>
      <div class="hero__lang">
        <label class="lang-switch">
          <span data-i18n="langLabel">Idioma</span>
          <select id="lang-select" data-lang-options="short"></select>
        </label>
      </div>
    </header>

    <div id="multiplayer-app"></div>
    <template id="multiplayer-tpl">
    <main class="grid">
      <section id="catalog-panel" class="panel">
        <div class="panel__header">
          <div>
            <p class="eyebrow">{{ t('publicListEyebrow') }}</p>
            <h2>{{ t('publicListTitle') }}</h2>
            <p class="subtext">{{ t('publicListDesc') }}</p>
          </div>
          <div class="panel__actions">
            <input id="search" type="search" v-model="search" @input="page = 0" :placeholder="t('searchPlaceholder')">
            <label for="sort" class="muted">{{ t('sortLabel') }}</label>
            <select id="sort" v-model="sortOrder" @change="page = 0">
              <option value="plays">{{ t('sortPlays') }}</option>
              <option value="recent">{{ t('sortNewest') }}</option>
              <option value="rating">{{ t('sortRating') }}</option>
              <option value="alpha">{{ t('sortAlphaAsc') }}</option>
              <option value="alpha-desc">{{ t('sortAlphaDesc') }}</option>
            </select>
          </div>
        </div>
        <div class="panel__filters">
          <label for="tag-filter" class="muted">{{ t('filterTagLabel') }}</label>
          <div id="tag-filter" class="tag-filter" role="group" aria-label="Etiquetas">
            <template v-if="tagFilterExpanded">
              <label v-for="item in allTags" :key="item.tag" class="tag-filter__item">
                <input type="checkbox" :value="item.tag" v-model="filters.tags" @change="page = 0">
                <span>{{ item.tag }}</span>
              </label>
            </template>
          </div>
          <div class="tag-filter__actions">
            <button id="tags-select-all" class="tag-filter__btn is-icon" type="button" :aria-label="t('filterTagSelectAll')" @click="selectAllTags">
              <span class="tag-filter__icon" aria-hidden="true">✓</span>
              <span class="sr-only">{{ t('filterTagSelectAll') }}</span>
            </button>
            <button id="tags-toggle" v-show="allTags.length > 0" class="tag-filter__btn is-icon" type="button" :aria-label="tagToggleLabel" @click="tagFilterExpanded = !tagFilterExpanded">
              <span class="tag-filter__icon" aria-hidden="true">{{ tagFilterExpanded ? '▴' : '▾' }}</span>
              <span class="sr-only">{{ tagToggleLabel }}</span>
            </button>
            <button id="tags-clear" class="tag-filter__btn is-icon" type="button" :aria-label="t('filterTagClear')" @click="clearTags">
              <span class="tag-filter__icon" aria-hidden="true">×</span>
              <span class="sr-only">{{ t('filterTagClear') }}</span>
            </button>
          </div>
          <label for="min-questions" class="muted">{{ t('filterQuestionsLabel') }}</label>
          <input id="min-questions" type="number" min="1" inputmode="numeric" v-model="filters.minQuestions" @input="page = 0" :placeholder="t('filterMinPlaceholder')">
          <span class="muted">-</span>
          <input id="max-questions" type="number" min="1" inputmode="numeric" v-model="filters.maxQuestions" @input="page = 0" :placeholder="t('filterMaxPlaceholder')">
          <label class="checkbox-inline">
            <input id="only-image" type="checkbox" v-model="filters.onlyImage" @change="page = 0">
            <span>{{ t('filterOnlyImage') }}</span>
          </label>
        </div>
        <div id="public-list" class="cards">
          <div v-for="q in pageItems" :key="q.id" class="card">
            <div class="card-thumb" :class="thumbLoaded[q.id] ? 'has-media' : 'placeholder'">
              <img alt="" :src="thumbFailed[q.id] ? null : thumbUrl(q)" @load="thumbLoaded[q.id] = true" @error="thumbFailed[q.id] = true">
            </div>
            <div class="card-header">
              <h3>{{ q.name || 'Quiz' }}</h3>
              <button type="button" class="favorite-btn" :class="{ 'is-active': isFavorite(q.id) }" :aria-pressed="isFavorite(q.id) ? 'true' : 'false'" :aria-label="favoriteLabel(q.id)" :title="favoriteLabel(q.id)" @click.stop="toggleFavorite(q.id)">{{ isFavorite(q.id) ? '❤' : '♡' }}</button>
            </div>
            <p class="muted">{{ format(t('questionsLabel'), { count: q.questionsCount || 0 }) }}</p>
            <div>
              <template v-for="tag in cleanTags(q)" :key="tag"><span class="tag">{{ tag }}</span></template>
            </div>
            <div class="card-rating">
              <div class="rating-stars">
                <button v-for="stars in 5" :key="stars" type="button" class="rating-star" :class="{ 'is-filled': stars <= displayRating(q) }" :data-value="stars" :aria-label="format(t('ratingStarLabel'), { stars: stars })" :title="format(t('ratingStarLabel'), { stars: stars })" @click.stop="rate(q, stars)">★</button>
              </div>
              <span class="rating-summary muted">{{ ratingSummary(q) }}</span>
            </div>
            <p class="muted">{{ (q.playsCount || 0) + ' ' + t('playsShort') + ' · ' + (q.playersCount || 0) + ' ' + t('playersShort') }}</p>
            <button class="btn btn-primary" type="button" @click="selectQuiz(q.id)">{{ t('selectQuiz') }}</button>
          </div>
        </div>
        <p id="public-empty" class="muted">{{ loading ? '…' : '' }}</p>
        <div id="public-pagination" class="pagination" :class="{ hidden: totalPages <= 1 }">
          <template v-if="totalPages > 1">
            <button :disabled="currentPage === 0" @click="page = currentPage - 1">&lt;</button>
            <span>{{ (currentPage + 1) + ' / ' + totalPages }}</span>
            <button :disabled="currentPage >= totalPages - 1" @click="page = currentPage + 1">&gt;</button>
          </template>
        </div>
      </section>

      <section id="game-panel" class="panel play-panel hidden">
        <div class="panel__header">
          <div>
            <p class="eyebrow" data-i18n="gameEyebrow">Partida local</p>
            <h2 id="selected-title" data-i18n="gameTitle">Elige un quiz para empezar</h2>
            <p id="selected-meta" class="muted" data-i18n="startSelect">Selecciona un quiz público.</p>
          </div>
        </div>

        <div id="setup" class="setup hidden">
          <div class="setup-row">
            <label for="player-count" class="muted" data-i18n="playerCountLabel">Jugadores</label>
            <select id="player-count">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>

          <div class="setup-row">
            <label for="question-mode" class="muted" data-i18n="questionModeLabel">Preguntas</label>
            <select id="question-mode">
              <option value="shared" data-i18n="questionModeShared">La misma para todos</option>
              <option value="per-player" data-i18n="questionModePerPlayer">Una diferente por jugador</option>
            </select>
          </div>

          <div class="setup-row setup-row--question-count">
            <label for="question-count" class="muted" data-i18n="questionCountLabel">Preguntas a jugar</label>
            <div class="question-count-controls">
              <input id="question-count" type="number" min="1" step="1" inputmode="numeric" autocomplete="off">
              <span id="question-count-total" class="muted"></span>
            </div>
          </div>
          <div class="setup-row setup-row--question-count">
            <label for="question-time" class="muted" data-i18n="questionTimeLabel">Tiempo por pregunta (segundos)</label>
            <div class="question-count-controls">
              <input id="question-time" type="number" min="5" max="120" step="1" inputmode="numeric" autocomplete="off" data-i18n-placeholder="questionTimePlaceholder" placeholder="Auto">
            </div>
          </div>

          <p class="muted" data-i18n="playerNamesLabel">Nombres de jugadores</p>
          <div id="player-names" class="player-names"></div>

          <div class="setup-actions">
            <button id="start-btn" class="btn btn-primary" data-i18n="startButton">Empezar</button>
          </div>
        </div>

        <div id="game" class="game hidden">
          <div class="game-header">
            <span id="question-progress" class="pill"></span>
            <span id="timer-pill" class="pill pill-timer"></span>
          </div>

          <div class="question-card">
            <p id="question-text" class="question-text"></p>
            <div id="question-media" class="question-media hidden">
              <img id="question-image" alt="">
              <video id="question-video" controls playsinline></video>
              <iframe id="question-iframe" title="video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>

          <div id="players" class="players"></div>
        </div>

        <div id="results" class="results hidden">
          <h3 data-i18n="finishTitle">Partida terminada</h3>
          <ol id="ranking-list" class="ranking-list"></ol>
          <div class="result-actions">
            <button id="play-again" class="btn btn-primary" data-i18n="playAgain">Repetir</button>
            <button id="play-same" class="btn btn-ghost" data-i18n="playSame">Repetir mismas preguntas</button>
            <button id="pick-another" class="btn btn-ghost" data-i18n="pickAnother">Elegir otro quiz</button>
          </div>
        </div>
      </section>
    </main>

    <div id="round-ranking-modal" class="mp-modal" aria-hidden="true">
      <div class="mp-modal__content" role="dialog" aria-modal="true">
        <h3 class="mp-modal__title" data-i18n="roundRankingTitle">Ranking</h3>
        <ol id="round-ranking-list" class="ranking-list"></ol>
        <button id="round-ranking-continue" class="btn btn-primary" data-i18n="roundContinue">Continuar</button>
      </div>
    </div>
    </template>


    <div class="music-section bottom-music">
      <div id="multiplayer-music-player" class="music-player-shell"></div>
    </div>

    <footer class="ett-footer">
      <p class="ett-footer__id">
        <span class="ett-footer__brand">EduTicTac</span>
        <span aria-hidden="true">·</span>
        <span class="ett-footer__service">EduHoot</span>
        <span class="ett-footer__version" id="app-version" aria-live="polite"></span>
      </p>
      <div class="ett-footer__links">
        <a href="https://edutictac.es/" target="_blank" rel="noopener">edutictac.es</a>
        <a href="https://edutictac.es/privacitat.html" target="_blank" rel="noopener" data-i18n="footerPrivacy">Privacidad</a>
        <a href="https://git.edutictac.es/Edutictac/eduhoot" target="_blank" rel="noopener" data-i18n="footerSource">Código fuente</a>
        <a href="https://git.edutictac.es/Edutictac/eduhoot/src/branch/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a>
      </div>
    </footer>

    <script src="../js/music-player.js"></script>
    <script src="/js/languages.js"></script>
    <script src="/js/env-badge.js"></script>
    <script src="../js/libs/vue.global.prod.js"></script>
    <script src="../js/multiplayer.js"></script>
      <script src="/js/app-version.js"></script>
    </body>
</html>
