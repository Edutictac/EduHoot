<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Host | EduHoot</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel = "stylesheet" href = "../css/host.css">
        <link rel="stylesheet" href="/css/dropdowns.css">
        <link rel = "stylesheet" href = "../css/music-player.css">
        <link href="/css/fonts.css" rel="stylesheet">
        <link href="/css/fonts.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/edutictac-footer.css">
        <link rel="stylesheet" href="/css/edutictac-shared.css">
        <script src="/js/edutictac-chip.js"></script>
        <script src="https://commons.edutictac.es/assets/account-widget.js" defer></script>
        <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
    </head>
    <body>
        <div class="host-top-row">
            <button id = "cancel">Cancelar partida</button>
            <edutictac-account class="site-account" data-base="https://commons.edutictac.es"></edutictac-account>
            <label class="lang-switch host-lang">
                <span>Idioma</span>
                <select id="host-lang-select" data-lang-options="name"></select>
            </label>
        </div>
        <!-- Lobby: app de Vue (host.js) que es munta ací amb la plantilla de baix. -->
        <div id="host-lobby"></div>
        <template id="host-lobby-tpl">
            <div class="join-cta">
                <div class="join-text">
                    <h2 id="title">{{ t('join_title') }}</h2>
                    <div class="pin-badge">
                        <span class="pin-label">{{ t('pin_label') }}</span>
                        <span id="gamePinText" class="pin-value">{{ pin || '—' }}</span>
                    </div>
                    <p id="host-error" class="host-error" :style="{ display: errorMessage ? 'block' : 'none' }">{{ errorMessage }}</p>
                </div>
                <div class="qr-card">
                    <p class="qr-label">{{ t('scan_qr') }}</p>
                    <div class="qr-img">
                        <img id="join-qr" :src="qrSrc" :aria-label="joinUrl" alt="QR eduhoot.edutictac.es" loading="lazy">
                    </div>
                    <a id="join-url" class="qr-url" :href="joinUrl" target="_blank" rel="noopener">{{ joinLabel }}</a>
                </div>
            </div>
            <div id="host-options">
                <label><input type="checkbox" id="opt-rand-q" v-model="options.randomQuestions"> <span>{{ t('opt_rand_q') }}</span></label>
                <label><input type="checkbox" id="opt-rand-a" v-model="options.randomAnswers"> <span>{{ t('opt_rand_a') }}</span></label>
                <label><input type="checkbox" id="opt-send-students" v-model="options.sendToStudents"> <span>{{ t('opt_send_students') }}</span><br><small class="opt-hint">{{ t('opt_send_students_hint') }}</small></label>
                <label><input type="checkbox" id="opt-show-scores" v-model="options.showScoresBetween"> <span>{{ t('opt_show_scores') }}</span></label>
                <label class="opt-inline">
                    <span>{{ t('opt_time') }}</span>
                    <input type="number" id="opt-time" min="5" max="120" placeholder="Auto" v-model="options.time">
                </label>
                <small>{{ t('opt_time_help') }}</small>
            </div>
            <div id="players" class="players-list">
                <div class="player-item" v-for="(player, index) in players" :key="index">
                    <span class="player-icon">{{ player.icon || '' }}</span>
                    <span class="player-name">{{ player.name || '' }}</span>
                </div>
            </div>
            <br>
            <button id="start" @click="startGame">{{ t('start_btn') }}</button>
            <br>
            <br>
        </template>

        <div id="host-lobby-music-player" class="music-player-shell host-lobby-music-player"></div>

        <footer class="ett-footer">
            <p class="ett-footer__id">
                <span class="ett-footer__brand">EduTicTac</span>
                <span aria-hidden="true">·</span>
                <span class="ett-footer__service">EduHoot</span>
                <span class="ett-footer__version" id="app-version" aria-live="polite"></span>
            </p>
            <div class="ett-footer__links">
                <a href="https://edutictac.es/" target="_blank" rel="noopener">edutictac.es</a>
                <a href="https://edutictac.es/privacitat.html" target="_blank" rel="noopener" data-i18n="footerPrivacy">Privacidad</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot" target="_blank" rel="noopener" data-i18n="footerSource">Código fuente</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot/src/branch/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a>
            </div>
        </footer>

        <script src = "../socket.io/socket.io.js"></script>
        <script src = "../js/libs/jqueryLibrary.js"></script>
        <script src = "../js/libs//deparam.js"></script>
        <script src="/js/languages.js"></script>
        <script src="/js/env-badge.js"></script>
        <script src = "../js/i18n-host.js"></script>
        <script src = "../js/music-player.js"></script>
        <script src = "../js/libs/vue.global.prod.js"></script>
        <script src = "../js/host.js"></script>
        <script src="/js/app-version.js"></script>
    </body>
</html>
