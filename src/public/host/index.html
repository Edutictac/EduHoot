<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Host | EduHoot</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel = "stylesheet" href = "../css/host.css">
        <link rel = "stylesheet" href = "../css/music-player.css">
        <link href="/css/fonts.css" rel="stylesheet">
        <link href="/css/fonts.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/edutictac-footer.css">
        <link rel="stylesheet" href="/css/edutictac-shared.css">
        <script src="/js/edutictac-chip.js"></script>
        <script src="https://commons.edutictac.es/assets/account-widget.js" defer onerror="document.documentElement.classList.add('account-fallback')"></script>
        <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
    </head>
    <body>
        <div class="host-top-row">
            <button id = "cancel" onclick = "endGame()">Cancelar partida</button>
            <edutictac-account class="site-account" data-base="https://commons.edutictac.es"></edutictac-account>
            <label class="lang-switch host-lang">
                <span>Idioma</span>
                <select id="host-lang-select">
                    <option value="ca">Català</option>
                    <option value="va">Valencià</option>
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </label>
        </div>
        <div class="join-cta">
            <div class="join-text">
                <h2 id = "title" data-i18n-host="join_title">Únete a esta partida con el PIN:</h2>
                <div class="pin-badge">
                    <span class="pin-label" data-i18n-host="pin_label">PIN</span>
                    <span id="gamePinText" class="pin-value">—</span>
                </div>
                <p id="host-error" class="host-error" style="display:none;"></p>
            </div>
            <div class="qr-card">
                <p class="qr-label" data-i18n-host="scan_qr">Escanea el código QR para entrar</p>
                <div class="qr-img">
                    <img id="join-qr" alt="QR eduhoot.edutictac.es" loading="lazy">
                </div>
                <a id="join-url" class="qr-url" href="https://eduhoot.edutictac.es/" target="_blank" rel="noopener">eduhoot.edutictac.es</a>
            </div>
        </div>
        <div id="host-options">
            <label><input type="checkbox" id="opt-rand-q"> <span data-i18n-host="opt_rand_q">Preguntas aleatorias</span></label>
            <label><input type="checkbox" id="opt-rand-a" checked> <span data-i18n-host="opt_rand_a">Respuestas aleatorias</span></label>
            <label><input type="checkbox" id="opt-send-mobile" checked> <span data-i18n-host="opt_send_mobile">Enviar pregunta a los móviles</span></label>
            <label><input type="checkbox" id="opt-show-scores" checked> <span data-i18n-host="opt_show_scores">Mostrar puntuaciones entre preguntas</span></label>
            <label class="opt-inline">
                <span data-i18n-host="opt_time">Tiempo por pregunta (s)</span>
                <input type="number" id="opt-time" min="5" max="120" placeholder="Auto">
            </label>
            <small data-i18n-host="opt_time_help">Déjalo vacío para usar el tiempo definido en cada pregunta del quiz.</small>
        </div>
        <div id="players" class="players-list"></div>
        <br>
        <button id = 'start' onclick = "startGame()" data-i18n-host="start_btn">Iniciar partida</button>
        <br>
        <br>

        <div id="host-lobby-music-player" class="music-player-shell host-lobby-music-player"></div>

        <footer class="ett-footer">
            <p class="ett-footer__id">
                <span class="ett-footer__brand">EduTicTac</span>
                <span aria-hidden="true">·</span>
                <span class="ett-footer__service">EduHoot</span>
                <span class="ett-footer__version" id="sw-version" aria-live="polite"></span>
            </p>
            <div class="ett-footer__links">
                <a href="https://edutictac.es/" target="_blank" rel="noopener">edutictac.es</a>
                <a href="https://edutictac.es/privacitat.html" target="_blank" rel="noopener" data-i18n="footerPrivacy">Privacidad</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot" target="_blank" rel="noopener" data-i18n="footerSource">Código fuente</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot/src/branch/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a>
            </div>
        </footer>

        <script src = "../socket.io/socket.io.js"></script>
        <script src = "../js/libs/jqueryLibrary.js"></script>
        <script src = "../js/libs//deparam.js"></script>
        <script src = "../js/i18n-host.js"></script>
        <script src = "../js/music-player.js"></script>
        <script src = "../js/host.js"></script>
    </body>
</html>
