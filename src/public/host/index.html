<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Host | EduHoot</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel = "stylesheet" href = "../css/host.css">
        <link rel = "stylesheet" href = "../css/hostKick.css">
        <link rel="stylesheet" href="/css/dropdowns.css">
        <link rel = "stylesheet" href = "../css/music-player.css">
        <link href="/css/fonts.css" rel="stylesheet">
        <link href="/css/fonts.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/edutictac-footer.css">
        <link rel="stylesheet" href="/css/edutictac-shared.css">
        <script src="/js/edutictac-chip.js"></script>
        <script src="https://commons.edutictac.es/assets/account-widget.js" defer></script>
        <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
            <link rel="stylesheet" href="/css/page-fit.css">
    </head>
    <body>
        <div class="host-top-row">
            <label class="lang-switch host-lang">
                <span>Idioma</span>
                <select id="host-lang-select" data-lang-options="name"></select>
            </label>
            <edutictac-account class="site-account" data-base="https://commons.edutictac.es"></edutictac-account>
        </div>
        <!-- Lobby: app de Vue (host.js) que es munta ací amb la plantilla de baix. -->
        <div id="host-lobby"></div>
        <template id="host-lobby-tpl">
            <div class="join-cta">
                <img class="host-logo" src="/icons/logo.svg" alt="EduHoot">
                <div class="join-text">
                    <p v-if="quizName" id="quiz-name" class="quiz-name">{{ quizName }}</p>
                    <h2 id="title">{{ t('join_title') }}</h2>
                    <div class="pin-badge">
                        <span class="pin-label">{{ t('pin_label') }}</span>
                        <span id="gamePinText" class="pin-value">{{ pin || '—' }}</span>
                    </div>
                    <p id="host-error" class="host-error" :style="{ display: errorMessage ? 'block' : 'none' }">{{ errorMessage }}</p>
                </div>
                <div class="qr-card">
                    <p class="qr-label">{{ t('scan_qr') }}</p>
                    <div class="qr-img">
                        <img id="join-qr" :src="qrSrc" :aria-label="joinUrl" alt="QR eduhoot.edutictac.es" loading="lazy">
                    </div>
                    <a id="join-url" class="qr-url" :href="joinUrl" target="_blank" rel="noopener">{{ joinLabel }}</a>
                </div>
            </div>
            <div id="host-options">
                <!-- Grupo 1: casillas (se activan o desactivan). -->
                <div class="opt-group opt-group--checks" role="group" aria-labelledby="opt-group-checks-title">
                    <h3 id="opt-group-checks-title" class="opt-group__title">{{ t('opt_group_checks') }}</h3>
                    <label :title="t('tip_rand_q')"><input type="checkbox" id="opt-rand-q" v-model="options.randomQuestions"> <span>{{ t('opt_rand_q') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='rand_q' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('rand_q')">?</button><span v-if="helpOpen==='rand_q'" class="help-pop" role="note">{{ t('tip_rand_q') }}</span></span></label>
                    <label :title="t('tip_rand_a')"><input type="checkbox" id="opt-rand-a" v-model="options.randomAnswers"> <span>{{ t('opt_rand_a') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='rand_a' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('rand_a')">?</button><span v-if="helpOpen==='rand_a'" class="help-pop" role="note">{{ t('tip_rand_a') }}</span></span></label>
                    <label :title="t('tip_send_students')"><input type="checkbox" id="opt-send-students" v-model="options.sendToStudents"> <span>{{ t('opt_send_students') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='send_students' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('send_students')">?</button><span v-if="helpOpen==='send_students'" class="help-pop" role="note">{{ t('tip_send_students') }}</span></span></label>
                    <label :title="t('tip_show_scores')"><input type="checkbox" id="opt-show-scores" v-model="options.showScoresBetween"> <span>{{ t('opt_show_scores') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='show_scores' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('show_scores')">?</button><span v-if="helpOpen==='show_scores'" class="help-pop" role="note">{{ t('tip_show_scores') }}</span></span></label>
                    <label :title="t('tip_show_answers')"><input type="checkbox" id="opt-show-answers" v-model="options.showCorrectAnswers"> <span>{{ t('opt_show_answers') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='show_answers' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('show_answers')">?</button><span v-if="helpOpen==='show_answers'" class="help-pop" role="note">{{ t('tip_show_answers') }}</span></span></label>
                    <label :title="t('tip_streak')"><input type="checkbox" id="opt-streak" v-model="options.streak"> <span>{{ t('opt_streak') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='streak' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('streak')">?</button><span v-if="helpOpen==='streak'" class="help-pop" role="note">{{ t('tip_streak') }}</span></span></label>
                    <label :title="t('tip_ghost')"><input type="checkbox" id="opt-ghost-live" v-model="options.ghostMode"> <span>{{ t('opt_ghost') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='ghost' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('ghost')">?</button><span v-if="helpOpen==='ghost'" class="help-pop" role="note">{{ t('tip_ghost') }}</span></span></label>
                </div>
                <!-- Grupo 2: ajustes que se eligen de una lista o se escriben. -->
                <div class="opt-group opt-group--values" role="group" aria-labelledby="opt-group-values-title">
                    <h3 id="opt-group-values-title" class="opt-group__title">{{ t('opt_group_values') }}</h3>
                    <label class="opt-auto" :title="t('tip_mode')"><span>{{ t('opt_mode') }}</span>
                        <select id="opt-mode" v-model="options.mode">
                            <option value="live">{{ t('opt_mode_live') }}</option>
                            <option value="selfPaced">{{ t('opt_mode_self') }}</option>
                        </select><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='mode' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('mode')">?</button><span v-if="helpOpen==='mode'" class="help-pop" role="note">{{ t('tip_mode') }}</span></span></label>
                    <fieldset id="opt-name-mode" class="name-mode" :title="t('tip_name_mode')">
                        <legend>{{ t('opt_name_mode') }} <span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='name_mode' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('name_mode')">?</button><span v-if="helpOpen==='name_mode'" class="help-pop" role="note">{{ t('tip_name_mode') }}</span></span></legend>
                        <label :title="t('tip_name_typed')"><input type="radio" name="name-mode" value="typed" v-model="options.nameMode" :disabled="nameModeLocked" @change="emitNameMode"> <span>{{ t('opt_name_typed') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='name_typed' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('name_typed')">?</button><span v-if="helpOpen==='name_typed'" class="help-pop" role="note">{{ t('tip_name_typed') }}</span></span></label>
                        <label :title="t('tip_name_random')"><input type="radio" name="name-mode" value="random" v-model="options.nameMode" :disabled="nameModeLocked" @change="emitNameMode"> <span>{{ t('opt_name_random') }}</span><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='name_random' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('name_random')">?</button><span v-if="helpOpen==='name_random'" class="help-pop" role="note">{{ t('tip_name_random') }}</span></span></label>
                    </fieldset>
                    <label v-if="options.mode !== 'selfPaced'" class="opt-auto" :title="t('tip_auto')"><span>{{ t('opt_auto') }}</span>
                        <select id="opt-auto" v-model.number="options.autoAdvanceSec">
                            <option :value="0">{{ t('opt_auto_manual') }}</option>
                            <option v-for="n in autoAdvanceChoices" :key="n" :value="n">{{ n }} s</option>
                        </select>
                    <span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='auto' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('auto')">?</button><span v-if="helpOpen==='auto'" class="help-pop" role="note">{{ t('tip_auto') }}</span></span></label>
                    <div class="opt-time">
                        <label class="opt-inline" :title="t('tip_time')">
                            <span>{{ t('opt_time') }}</span>
                            <input type="number" id="opt-time" min="5" max="120" placeholder="Auto" v-model="options.time">
                        <span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='time' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('time')">?</button><span v-if="helpOpen==='time'" class="help-pop" role="note">{{ t('tip_time') }}</span></span></label>
                    </div>
                    <div class="opt-time">
                        <label class="opt-inline" :title="t('tip_video_start')">
                            <span>{{ t('opt_video_start') }}</span>
                            <input type="number" id="opt-video-start" min="0" max="3600" placeholder="0" v-model="options.videoStartSec">
                            <span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='video_start' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('video_start')">?</button><span v-if="helpOpen==='video_start'" class="help-pop" role="note">{{ t('tip_video_start') }}</span></span>
                        </label>
                    </div>
                    <label v-if="hasComposite" class="opt-auto" id="opt-matching-extra-row" :title="t('tip_matching_extra')"><span>{{ t('opt_matching_extra') }}</span>
                        <select id="opt-matching-extra" v-model.number="options.matchingExtraTime">
                            <option v-for="p in matchingExtraChoices" :key="p" :value="p">+{{ p }} %</option>
                        </select>
                    <span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='matching_extra' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('matching_extra')">?</button><span v-if="helpOpen==='matching_extra'" class="help-pop" role="note">{{ t('tip_matching_extra') }}</span></span></label>
                    <label v-if="hasMatching && !options.sendToStudents" class="opt-auto" id="opt-matching-blind-row" :title="t('tip_matching_blind')"><span>{{ t('opt_matching_blind') }}</span>
                        <select id="opt-matching-blind" v-model="options.matchingBlindStyle">
                            <option value="codes">{{ t('opt_matching_blind_codes') }}</option>
                            <option value="select">{{ t('opt_matching_blind_select') }}</option>
                            <option value="steps">{{ t('opt_matching_blind_steps') }}</option>
                        </select>
                    <span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='matching_blind' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('matching_blind')">?</button><span v-if="helpOpen==='matching_blind'" class="help-pop" role="note">{{ t('tip_matching_blind') }}</span></span></label>
                </div>
                <details id="opt-advanced" class="advanced-options">
                    <summary :title="t('tip_advanced')">{{ t('opt_advanced') }} <span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='advanced' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('advanced')">?</button><span v-if="helpOpen==='advanced'" class="help-pop" role="note">{{ t('tip_advanced') }}</span></span></summary>
                    <label class="opt-inline" :title="t('tip_t_host')"><span>{{ t('opt_t_host') }}</span>
                        <input type="number" id="opt-t-host" :min="120" :max="300" placeholder="120" v-model="options.timings.hostReconnectSec" @change="emitGameTimings"><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='t_host' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('t_host')">?</button><span v-if="helpOpen==='t_host'" class="help-pop" role="note">{{ t('tip_t_host') }}</span></span></label>
                    <label class="opt-inline" :title="t('tip_t_player')"><span>{{ t('opt_t_player') }}</span>
                        <input type="number" id="opt-t-player" :min="40" :max="120" placeholder="40" v-model="options.timings.playerReconnectSec" @change="emitGameTimings"><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='t_player' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('t_player')">?</button><span v-if="helpOpen==='t_player'" class="help-pop" role="note">{{ t('tip_t_player') }}</span></span></label>
                    <label class="opt-inline" :title="t('tip_t_cleanup')"><span>{{ t('opt_t_cleanup') }}</span>
                        <input type="number" id="opt-t-cleanup" :min="100" :max="600" placeholder="100" v-model="options.timings.cleanupSec" @change="emitGameTimings"><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='t_cleanup' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('t_cleanup')">?</button><span v-if="helpOpen==='t_cleanup'" class="help-pop" role="note">{{ t('tip_t_cleanup') }}</span></span></label>
                    <label class="opt-inline" :title="t('tip_t_inactivity')"><span>{{ t('opt_t_inactivity') }}</span>
                        <input type="number" id="opt-t-inactivity" :min="30" :max="60" placeholder="30" v-model="options.timings.inactivityMin" @change="emitGameTimings"><span class="help"><button type="button" class="help-btn" :aria-expanded="helpOpen==='t_inactivity' ? 'true' : 'false'" :aria-label="t('help_aria')" @click.prevent.stop="toggleHelp('t_inactivity')">?</button><span v-if="helpOpen==='t_inactivity'" class="help-pop" role="note">{{ t('tip_t_inactivity') }}</span></span></label>
                    <small>{{ t('opt_t_help') }}</small>
                </details>
            </div>
            <div id="players" class="players-list">
                <div class="player-item" v-for="(player, index) in players" :key="index">
                    <span class="player-icon">{{ player.icon || '' }}</span>
                    <span class="player-name">{{ player.name || '' }}</span>
                    <button v-if="pendingKickId !== player.playerId" type="button" class="kick-btn" @click="askKick(player)">{{ t('kick_btn') }}</button>
                    <button v-else type="button" class="kick-btn kick-btn--confirm" @click="confirmKick(player)">{{ t('kick_confirm') }}</button>
                </div>
            </div>
            <div v-if="kickedList.length" id="kicked-list" class="kicked-list">
                <p class="kicked-title">{{ t('kicked_title') }}</p>
                <div class="kicked-item" v-for="k in kickedList" :key="k.id">
                    <span class="kicked-name">{{ k.name }}</span>
                    <button type="button" class="unkick-btn" @click="unkick(k)">{{ t('unkick_btn') }}</button>
                </div>
            </div>
            <br>
            <div class="start-row">
                <button id="cancel" type="button" :class="{ 'is-confirming': cancelConfirming }" @click="askCancelLobby">{{ cancelConfirming ? t('cancel_confirm') : t('cancel_btn') }}</button>
                <button id="start" @click="startGame" :disabled="starting">{{ starting ? t('starting') : t('start_btn') }}</button>
            </div>
            <p v-if="starting" class="starting-msg" role="status">{{ t('starting') }}</p>
            <br>
            <br>
        </template>

        <div id="host-lobby-music-player" class="music-player-shell host-lobby-music-player"></div>

        <footer class="ett-footer">
            <p class="ett-footer__id">
                <span class="ett-footer__brand">EduTicTac</span>
                <span aria-hidden="true">·</span>
                <span class="ett-footer__service">EduHoot</span>
                <span class="ett-footer__version" id="app-version" aria-live="polite"></span>
            </p>
            <div class="ett-footer__links">
                <a href="https://edutictac.es/" target="_blank" rel="noopener">edutictac.es</a>
                <a href="https://edutictac.es/privacitat.html" target="_blank" rel="noopener" data-i18n="footerPrivacy">Privacidad</a>
                <a href="https://edutictac.es/galetes.html" target="_blank" rel="noopener" data-i18n="footerCookies">Galetes</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot" target="_blank" rel="noopener" data-i18n="footerSource">Código fuente</a>
                <a href="https://git.edutictac.es/Edutictac/eduhoot/src/branch/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a>
            </div>
        </footer>

        <script src = "../socket.io/socket.io.js"></script>
        <script src = "../js/libs/jqueryLibrary.js"></script>
        <script src = "../js/libs//deparam.js"></script>
        <script src="/js/languages.js"></script>
        <script src="/js/env-badge.js"></script>
        <script src = "../js/i18n-host.js"></script>
        <script src = "../js/music-player.js"></script>
        <script src = "../js/libs/vue.global.prod.js"></script>
        <script src = "../js/host.js"></script>
        <script src="/js/app-version.js"></script>
    </body>
</html>
