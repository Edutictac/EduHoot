<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
        <meta charset="utf-8">
        <title>Game | EduHoot</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../../css/hostGameView.css">
        <link rel="stylesheet" href="../../css/hostKick.css">
        <link rel="stylesheet" href="../../css/hostSelfPaced.css">
        <link href="/css/fonts.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/page-fit.css">
    </head>
    <body>
        <!-- Modo autoritme (feature 3): vista del anfitrión. Sin «Pregunta siguiente»: cada alumno
             avanza solo y aquí se ve el progreso; la partida acaba cuando el anfitrión la cierra.
             Pantalla propia, separada de /host/game/. -->
        <div id="host-sp"></div>
        <template id="host-sp-tpl">
        <div class="host-shell">
            <div class="host-top">
                <div id="pin-badge" class="pin-badge" v-if="pin">{{ pinText }}</div>
                <div class="spacer"><p v-if="quizName" id="quizName" class="game-quiz-name">{{ quizName }}</p></div>
                <label class="lang-switch">
                    <span data-i18n="langLabel">Idioma</span>
                    <select id="lang-select" data-lang-options="name"></select>
                </label>
            </div>
            <h4 id="spSummary" class="sp-summary">{{ summaryText }}</h4>
            <div class="top-row">
                <button type="button" id="spEndBtn" class="sp-btn sp-btn--end" v-if="!ended" :class="{ 'is-confirming': endConfirming }" @click="askEnd">{{ endConfirming ? t('endConfirm') : t('endGame') }}</button>
                <button type="button" id="spDownloadBtn" class="sp-btn sp-btn--report" v-if="ended" @click="downloadReport">{{ t('downloadReport') }}</button>
                <button type="button" id="spBackBtn" class="sp-btn" v-if="ended" @click="goBack">{{ t('backToLibrary') }}</button>
            </div>
            <label class="sp-host-scores"><input type="checkbox" id="spHostScores" :checked="hostScores" @change="setHostScores"> <span>{{ t('hostScores') }}</span></label>
            <section id="spRanking" class="sp-ranking" v-if="top.length">
                <h3>{{ t('topPlayers') }}</h3>
                <ol><li v-for="p in top" :key="p.playerId">{{ (p.icon ? p.icon + ' ' : '') + p.name + ' - ' + p.score }}</li></ol>
            </section>
            <p v-if="!ended && !list.length" id="spEmpty" class="sp-empty">{{ t('noStudents') }}</p>
            <ul id="spList" class="sp-list" v-if="list.length">
                <li v-for="p in list" :key="p.playerId" class="sp-row" :class="{ 'is-finished': p.finished }">
                    <span class="sp-row__icon">{{ p.icon }}</span>
                    <span class="sp-row__name"><span v-if="p.hand" class="sp-row__hand" role="img" :aria-label="t('handRaised')" :title="t('handRaised')">✋</span>{{ p.name }}</span>
                    <span class="sp-row__bar" role="progressbar" :aria-valuenow="p.answered" aria-valuemin="0" :aria-valuemax="p.total"><span class="sp-row__fill" :style="{ width: pct(p) + '%' }"></span></span>
                    <span class="sp-row__count">{{ p.finished ? t('finished') : (p.answered + ' / ' + p.total) }}</span>
                    <template v-if="!ended">
                        <button v-if="pendingKickId !== p.playerId" type="button" class="kick-btn" @click="askKick(p)">{{ t('kickBtn') }}</button>
                        <button v-else type="button" class="kick-btn kick-btn--confirm" @click="confirmKick(p)">{{ t('kickConfirm') }}</button>
                    </template>
                </li>
            </ul>
            <section id="spPodium" class="sp-podium" v-if="ended && podium.hostPodium === true">
                <h2>{{ t('topPlayers') }}</h2>
                <h3 v-for="(n, i) in podiumNames" :key="i">{{ (i + 1) + '. ' + n }}</h3>
            </section>
        </div>
        </template>
        <script src="../../socket.io/socket.io.js"></script>
        <script src="../../js/libs/jqueryLibrary.js"></script>
        <script src="../../js/libs/deparam.js"></script>
        <script src="/js/languages.js"></script>
        <script src="/js/env-badge.js"></script>
        <script src="../../js/libs/vue.global.prod.js"></script>
        <script src="../../js/hostSelfPaced.js"></script>
    </body>
</html>
